<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Time Machine is a free, community-driven archive documenting the history of Doraemon: episodes, movies, characters, and gadgets." />
    <meta name="theme-color" content="#f4f1ea" />
    <link rel="icon" type="image/png" href="%BASE_URL%assets/logo/tm-mark-128.png" />
    <title>Time Machine</title>

    <script>
      // SPA routing fallback (GitHub Pages). The generated 404.html redirects
      // /deep/path to /?/deep/path; this snippet restores the real URL in the
      // address bar and history before the app mounts. Harmless everywhere
      // else: it only acts when the ?/ marker is present.
      (function () {
        var m = location.search.match(/^\?\/(.*)/);
        if (!m) return;
        var base = document.baseURI.replace(/[^/]*$/, '');
        var target = new URL(decodeURIComponent(m[1]), base);
        history.replaceState(null, '', target.pathname + target.search + target.hash);
      })();
    </script>
    <link rel="preload" href="%BASE_URL%fonts/NotoSansJP-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Apply the saved theme (or the OS setting) before first paint to avoid a flash.
      // Keep this list in sync with THEMES in src/hooks/useTheme.js and the
      // :root[data-theme] blocks in src/styles/variables.css.
      (function () {
        var THEMES = ['light', 'dark', 'midnight', 'sakura', 'ocean', 'forest', 'amethyst'];
        var COLORS = {
          light: '#f4f1ea', dark: '#151a22', midnight: '#0d1220', sakura: '#faf3f4',
          ocean: '#071824', forest: '#10160f', amethyst: '#14101d',
        };
        try {
          var stored = localStorage.getItem('tm-theme');
          var theme = stored && COLORS[stored] ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]').setAttribute('content', COLORS[theme]);
        } catch (e) { /* private mode: light theme is the default */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
